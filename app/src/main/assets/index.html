<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#FDFBF7">
    <title>现代生活指南</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main id="app" class="app-shell"></main>

    <template id="onboarding-template">
      <section class="screen onboarding-screen">
        <header class="onboarding-header">
          <p class="eyebrow">Modern Huangli</p>
          <h1>现代生活指南</h1>
          <p>请完善你的个人信息，为你生成专属每日建议。</p>
        </header>

        <form id="profile-form" class="card form-card">
          <label class="form-item">
            <span>姓名</span>
            <input id="name" autocomplete="name" maxlength="20" placeholder="请输入你的姓名">
          </label>

          <fieldset class="form-item">
            <legend>性别</legend>
            <div class="segmented">
              <button type="button" class="segment" data-gender="male">男</button>
              <button type="button" class="segment" data-gender="female">女</button>
            </div>
          </fieldset>

          <label class="form-item">
            <span>出生日期</span>
            <input id="birthDate" type="date">
          </label>

          <label class="form-item">
            <span>出生时间</span>
            <input id="birthTime" type="time" value="12:00">
          </label>

          <label class="form-item">
            <span>所在城市</span>
            <input id="city" autocomplete="address-level2" maxlength="30" placeholder="请输入你所在的城市">
          </label>
        </form>

        <button id="submit-profile" class="primary-button" type="button">点击查看运势</button>
      </section>
    </template>

    <template id="home-template">
      <section class="screen content-screen swipe-surface">
        <section class="card date-selector">
          <button class="icon-button" type="button" data-action="prev-day" aria-label="前一天">‹</button>
          <div class="date-display">
            <strong id="current-date"></strong>
            <span id="date-subtitle"></span>
          </div>
          <button class="icon-button" type="button" data-action="next-day" aria-label="后一天">›</button>
        </section>

        <section class="card luck-card">
          <div class="luck-decor"></div>
          <div class="luck-header">
            <div>
              <p>运势指数</p>
              <div class="score-line">
                <strong id="luck-score">0</strong>
                <span>/100</span>
              </div>
            </div>
            <span id="keyword" class="keyword-pill"></span>
          </div>
          <div class="progress-track">
            <div id="score-progress" class="progress-bar"></div>
          </div>
          <p id="suggestion" class="suggestion"></p>
        </section>

        <section class="lucky-grid">
          <article class="card lucky-card">
            <span>幸运色</span>
            <strong id="lucky-color"></strong>
          </article>
          <article class="card lucky-card">
            <span>财位</span>
            <strong id="lucky-direction"></strong>
          </article>
        </section>

        <section class="card yj-card">
          <h2 class="yi-title"><span>✓</span> 宜</h2>
          <div id="yi-list" class="yj-list"></div>
        </section>

        <section class="card yj-card">
          <h2 class="ji-title"><span>✕</span> 忌</h2>
          <div id="ji-list" class="yj-list"></div>
        </section>

        <p class="slide-tip">左右滑动可以切换日期</p>
      </section>
    </template>

    <template id="calendar-template">
      <section class="screen content-screen">
        <section class="card month-header">
          <button class="icon-button" type="button" data-action="prev-month" aria-label="上个月">‹</button>
          <strong id="month-title"></strong>
          <button class="icon-button" type="button" data-action="next-month" aria-label="下个月">›</button>
        </section>

        <section class="card week-header" aria-label="星期">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </section>

        <section id="calendar-grid" class="card calendar-grid"></section>
      </section>
    </template>

    <template id="profile-template">
      <section class="screen content-screen">
        <section class="card profile-card">
          <div id="avatar" class="avatar"></div>
          <div>
            <strong id="profile-name"></strong>
            <span id="profile-meta"></span>
          </div>
        </section>

        <section class="card menu-list">
          <button class="menu-item" type="button" data-action="edit-profile">
            <span class="menu-icon">👤</span>
            <span>编辑个人信息</span>
            <span class="menu-arrow">›</span>
          </button>
          <button class="menu-item" type="button" data-action="show-about">
            <span class="menu-icon">ℹ</span>
            <span>关于我们</span>
            <span class="menu-arrow">›</span>
          </button>
          <button class="menu-item danger" type="button" data-action="logout">
            <span class="menu-icon">↪</span>
            <span>退出当前账号</span>
            <span class="menu-arrow">›</span>
          </button>
        </section>

        <p class="version">版本 v1.0.0</p>
      </section>
    </template>

    <nav id="tabbar" class="tabbar" hidden>
      <button type="button" data-route="home">
        <span>⌂</span>
        <small>今日</small>
      </button>
      <button type="button" data-route="calendar">
        <span>□</span>
        <small>月历</small>
      </button>
      <button type="button" data-route="profile">
        <span>◎</span>
        <small>我的</small>
      </button>
    </nav>

    <script src="./vendor/lunar.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
