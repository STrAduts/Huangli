name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build Android App APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare Android App version
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/huangli-android-app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huangli-android-app-version
          path: release/huangli-android-app.apk
          if-no-files-found: error
